<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OHMM Capture Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 420px;
        height: 96px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      .toast {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        height: 100%;
        padding: 16px 18px;
        border: 1px solid rgba(122, 219, 255, 0.38);
        border-radius: 8px;
        background: rgba(8, 13, 18, 0.9);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.32);
        color: #f4fbff;
      }

      .indicator {
        width: 12px;
        height: 12px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #7adbff;
        box-shadow: 0 0 18px rgba(122, 219, 255, 0.7);
      }

      .toast.success {
        border-color: rgba(99, 241, 177, 0.5);
      }

      .toast.success .indicator {
        background: #63f1b1;
        box-shadow: 0 0 18px rgba(99, 241, 177, 0.68);
      }

      .toast.error {
        border-color: rgba(255, 94, 122, 0.5);
      }

      .toast.error .indicator {
        background: #ff5e7a;
        box-shadow: 0 0 18px rgba(255, 94, 122, 0.64);
      }

      .content {
        min-width: 0;
      }

      .label {
        margin: 0 0 4px;
        color: #91aab8;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .message {
        margin: 0;
        color: #f4fbff;
        font-size: 15px;
        font-weight: 650;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main class="toast" id="toast">
      <div class="indicator"></div>
      <div class="content">
        <p class="label">OHMM Gear Import</p>
        <p class="message" id="message">Bridge starting...</p>
      </div>
    </main>
    <script src="overlay.js"></script>
  </body>
</html>
